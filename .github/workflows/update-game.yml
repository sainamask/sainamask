name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: czl9707/gh-space-shooter@v2
        with:
          # FIXED: Swapping secrets.GITHUB_TOKEN to your secrets.GAME_TOKEN
          github-token: ${{ secrets.GAME_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
          # ADDED: This explicitly forces the engine to fetch your global profile matrix, not just this local repo
          type: 'user'

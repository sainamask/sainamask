name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: czl9707/gh-space-shooter@v2
        with:
          # UPDATED: Using your new secret token to pull private history
          github-token: ${{ secrets.GAME_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
